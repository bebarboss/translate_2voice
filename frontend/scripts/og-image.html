<!doctype html>
<!--
  ต้นฉบับของ public/brand/og.png (1200x630) รูปที่โชว์ตอนแชร์ลิงก์ (og:image / twitter:image)
  สร้างใหม่: เปิดไฟล์นี้จากโฟลเดอร์ frontend/scripts ด้วยเบราว์เซอร์ที่หน้าต่าง 1200x630 แล้วจับภาพ
  เช่น Playwright: page.setViewportSize({width:1200,height:630}); page.goto("file://.../scripts/og-image.html"); page.screenshot({path:"public/brand/og.png"})
-->
<html lang="th">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Anuphan; font-weight: 400; src: url(../node_modules/@fontsource/anuphan/files/anuphan-thai-400-normal.woff2) format("woff2"); unicode-range: U+0E01-0E5B, U+200C-200D, U+25CC; }
  @font-face { font-family: Anuphan; font-weight: 700; src: url(../node_modules/@fontsource/anuphan/files/anuphan-thai-700-normal.woff2) format("woff2"); unicode-range: U+0E01-0E5B, U+200C-200D, U+25CC; }
  @font-face { font-family: Anuphan; font-weight: 400; src: url(../node_modules/@fontsource/anuphan/files/anuphan-latin-400-normal.woff2) format("woff2"); }
  @font-face { font-family: Anuphan; font-weight: 700; src: url(../node_modules/@fontsource/anuphan/files/anuphan-latin-700-normal.woff2) format("woff2"); }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: Anuphan, sans-serif; color: #F2F2F3; background: #0B0B0E;
    display: flex; align-items: center; gap: 56px; padding: 0 84px; box-sizing: border-box; position: relative;
  }
  body::before {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(520px 420px at 250px 330px, rgba(61, 214, 140, .22), transparent 70%),
                radial-gradient(600px 380px at 1050px 600px, rgba(255, 138, 61, .16), transparent 70%);
  }
  img { position: relative; width: 340px; height: auto; flex: none; filter: drop-shadow(0 24px 40px rgba(0,0,0,.55)); }
  .copy { position: relative; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 14px; font-size: 34px; font-weight: 700; color: #C7C7CC; }
  .brand i { width: 14px; height: 14px; border-radius: 50%; background: #3DD68C; }
  h1 { margin: 18px 0 0; font-size: 92px; line-height: 1.2; font-weight: 700; letter-spacing: -.01em; }
  h1 span { color: #3DD68C; }
  p { margin: 18px 0 0; font-size: 34px; line-height: 1.45; color: #C7C7CC; max-width: 640px; }
</style>
</head>
<body>
  <img src="../public/brand/mascot.png" alt="">
  <div class="copy">
    <div class="brand"><i></i>Pakdee</div>
    <h1>พากย์ดี <span>ด้วย AI</span></h1>
    <p>แยกตัวละคร แปล และพากย์คลิปต่างประเทศเป็นเสียงไทย</p>
  </div>
</body>
</html>
