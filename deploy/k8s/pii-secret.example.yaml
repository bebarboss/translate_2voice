# Example only. Do not apply this file and do not commit a filled copy.
# It is not part of kustomization.yaml. Create Secret pakdee-pii from a
# mode-0600 env file, as described in docs/pii-encryption.md.
# stringData below is empty on purpose.
apiVersion: v1
kind: Secret
metadata:
  name: pakdee-pii
  namespace: pakdee
  labels:
    app.kubernetes.io/name: pakdee
    app.kubernetes.io/part-of: pakdee
type: Opaque
stringData:
  # PII_ENC_ACTIVE_VERSION is an integer such as 1 (or v1).
  # PII_ENC_KEYS is <version>:<base64 of 32 bytes> entries separated by commas.
  # PII_HMAC_KEY is base64 of 32 bytes.
  PII_ENC_ACTIVE_VERSION: ""
  PII_ENC_KEYS: ""
  PII_HMAC_KEY: ""
