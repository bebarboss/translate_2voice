# Hostname placeholder __KITE_HOST__ is replaced by install-kite.sh from KITE_HOST.
# WebSockets (logs, terminal) work on Traefik without an extra annotation.
# Do not compress this route; compression breaks websocket upgrades.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: secure-headers
  namespace: kite-system
  labels:
    app.kubernetes.io/name: kite
spec:
  headers:
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    stsPreload: true
    forceSTSHeader: true
    contentTypeNosniff: true
    referrerPolicy: strict-origin-when-cross-origin
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: long-timeout
  namespace: kite-system
  labels:
    app.kubernetes.io/name: kite
spec:
  forwardingTimeouts:
    dialTimeout: 30s
    responseHeaderTimeout: 30m
    idleConnTimeout: 30m
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kite
  namespace: kite-system
  labels:
    app.kubernetes.io/name: kite
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
    traefik.ingress.kubernetes.io/router.middlewares: kite-system-secure-headers@kubernetescrd
    traefik.ingress.kubernetes.io/service.serverstransport: kite-system-long-timeout@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: __KITE_HOST__
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kite
                port:
                  number: 8080
  tls:
    - hosts:
        - __KITE_HOST__
