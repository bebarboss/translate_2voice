# One replica, Recreate. The job queue lives in this process (see backend/run.py)
# and the media volume is ReadWriteOnce, so a second pod must not start.
# The image runs as root, matching backend/Dockerfile, so files copied from
# the Compose bind mount stay readable.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: pakdee
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: pakdee
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      terminationGracePeriodSeconds: 45
      initContainers:
        - name: wait-for-db
          image: busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              for i in $(seq 1 60); do
                if nc -z db 5432; then
                  exit 0
                fi
                echo "waiting for db:5432 ($i/60)"
                sleep 2
              done
              echo "db:5432 did not open" >&2
              exit 1
          resources:
            requests:
              cpu: 10m
              memory: 8Mi
            limits:
              cpu: 100m
              memory: 32Mi
      containers:
        - name: api
          image: ghcr.io/bebarboss/pakdee-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: pakdee-config
            - secretRef:
                name: pakdee-secrets
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1500m"
              memory: 1280Mi
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: backups
              mountPath: /app/backups
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: api-data
        - name: backups
          persistentVolumeClaim:
            claimName: api-backups
