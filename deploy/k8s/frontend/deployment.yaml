# Next.js standalone reads BACKEND_URL, PUBLIC_BACKEND_URL, API_KEY, and
# DIRECT_UPLOAD at request time. Kubernetes sets HOSTNAME to the pod name;
# the server must bind 0.0.0.0 instead, so HOSTNAME is set explicitly.
# The image user is uid 1001 (deploy/frontend.Dockerfile).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: pakdee
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/part-of: pakdee
    spec:
      automountServiceAccountToken: false
      # Ubuntu 26.04 (kernel 7.0, AppArmor 4) + k3s containerd 2.3: the default
      # cri-containerd.apparmor.d profile denies signals between processes in the
      # pod (kill: Permission denied), so postgres/gosu/sh hang. Run unconfined.
      securityContext:
        appArmorProfile:
          type: Unconfined
      imagePullSecrets:
        - name: ghcr-pull
      terminationGracePeriodSeconds: 20
      containers:
        - name: web
          image: ghcr.io/bebarboss/pakdee-web:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            allowPrivilegeEscalation: false
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: HOSTNAME
              value: 0.0.0.0
            - name: PORT
              value: "3000"
            - name: COOKIE_SECURE
              value: "1"
            - name: BACKEND_URL
              valueFrom:
                configMapKeyRef:
                  name: pakdee-config
                  key: BACKEND_URL
            - name: PUBLIC_BACKEND_URL
              valueFrom:
                configMapKeyRef:
                  name: pakdee-config
                  key: PUBLIC_BACKEND_URL
            - name: DIRECT_UPLOAD
              valueFrom:
                configMapKeyRef:
                  name: pakdee-config
                  key: DIRECT_UPLOAD
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: pakdee-secrets
                  key: API_KEY
          startupProbe:
            httpGet:
              path: /favicon.ico
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /favicon.ico
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /favicon.ico
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
