apiVersion: v1
kind: Service
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: pakdee
spec:
  type: ClusterIP
  # Pinned. Compose Caddy on the host dials this address (deploy/Caddyfile.k3s).
  # clusterIP is immutable: apply keeps it, and a different value is rejected.
  clusterIP: 10.43.26.212
  selector:
    app.kubernetes.io/name: web
  ports:
    - name: http
      port: 3000
      targetPort: http
