# Fresh install, when Traefik should stay down as well as ServiceLB.
# The VPS that is already running uses k3s-hold-servicelb.yaml instead
# (Traefik enabled, ServiceLB disabled). Both leave 80/443 to Caddy.
# Copy to /etc/rancher/k3s/config.yaml.d/00-pakdee-hold-ports.yaml before
# installing k3s. enable-ingress.sh removes these entries after Caddy stops.
disable:
  - traefik
  - servicelb
