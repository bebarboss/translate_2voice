# Example only. Copy to a path outside the repo, fill real values, apply, then delete the copy.
#   cp deploy/k8s/secret.example.yaml /tmp/pakdee-secret.yaml
#   nano /tmp/pakdee-secret.yaml
#   kubectl apply -f /tmp/pakdee-secret.yaml
#   shred -u /tmp/pakdee-secret.yaml   # or rm -P
#
# Do not commit the filled file. deploy/k8s/secret.yaml is gitignored.
# POSTGRES_PASSWORD and the password inside DATABASE_URL must match.
# Use a URL-safe password (letters and digits). Avoid @ : / # ? so the URL does not need encoding.
# Omit a key you do not use, except POSTGRES_*, DATABASE_URL, API_KEY,
# ADMIN_EMAILS, PAYMENT_PROVIDER, R2_ENABLED, R2_BUCKET, R2_ACCOUNT_ID, and R2_ENDPOINT.
# ADMIN_EMAILS names the real admins. Keep it here, not in config.env.
# Do not set MODAL_TOKEN_ID or MODAL_TOKEN_SECRET to an empty string; leave the real token or delete the key.
apiVersion: v1
kind: Secret
metadata:
  name: pakdee-secrets
  namespace: pakdee
  labels:
    app.kubernetes.io/name: pakdee
    app.kubernetes.io/part-of: pakdee
type: Opaque
stringData:
  POSTGRES_USER: pakdee
  POSTGRES_PASSWORD: change-me-long-random
  POSTGRES_DB: pakdee
  DATABASE_URL: postgresql://pakdee:change-me-long-random@db:5432/pakdee?sslmode=disable

  API_KEY: change-me-long-random
  # Comma-separated admin addresses. Real addresses stay in this Secret only.
  ADMIN_EMAILS: change-me@example.com
  # Production bills with Stripe. Do not leave this empty and do not set slip.
  PAYMENT_PROVIDER: stripe
  HF_TOKEN: change-me
  TYPHOON_API_KEY: change-me
  MODAL_TOKEN_ID: change-me
  MODAL_TOKEN_SECRET: change-me
  GOOGLE_CLIENT_ID: ""

  STRIPE_SECRET_KEY: ""
  STRIPE_WEBHOOK_SECRET: ""
  STRIPE_PUBLISHABLE_KEY: ""
  SMTP_PASSWORD: ""
  R2_ENABLED: "1"
  R2_BUCKET: change-me
  R2_ACCOUNT_ID: change-me
  R2_ENDPOINT: change-me
  R2_ACCESS_KEY_ID: ""
  R2_SECRET_ACCESS_KEY: ""
