# API บนเครื่อง (การ์ดจอ) + ngrok เปิดให้หน้าเว็บบน Vercel เรียกได้
# รัน: docker compose up -d --build   ค่าทั้งหมดอ่านจาก .env (ดู .env.example หมวด Docker / ngrok)
services:
  api:
    build: .
    image: thai-dubbing-api
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /app/data
      F5_CACHE_DIR: /models/f5
      FONTS_DIR: ""
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
      # แคชโมเดลบนเครื่อง ใช้ร่วมกับตอนรันนอก Docker ไม่ต้องโหลดซ้ำหลาย GB
      - ${HF_CACHE_HOST:-./models/huggingface}:/root/.cache/huggingface
      - ${TORCH_CACHE_HOST:-./models/torch}:/root/.cache/torch
      - ${F5_CACHE_DIR:-./models/f5}:/models/f5
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?ใส่ NGROK_AUTHTOKEN ใน .env}
    command: ["http", "api:8000", "--url", "${NGROK_DOMAIN:?ใส่ NGROK_DOMAIN ใน .env (โดเมนฟรีที่ dashboard.ngrok.com/domains)}"]
    ports:
      # หน้าดูคำขอที่ผ่าน ngrok http://localhost:4040
      - "127.0.0.1:4040:4040"
