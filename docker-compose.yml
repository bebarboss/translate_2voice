# API บนเครื่อง + Cloudflare Tunnel เปิดให้หน้าเว็บบน Vercel เรียกได้
# ขั้นที่ใช้การ์ดจอรันบน Modal (WORKER=modal ต้อง modal deploy modal_app.py จากโฟลเดอร์ backend/ ก่อน)
# รันจากรากโปรเจกต์: docker compose up -d --build
# รันโมเดลบนการ์ดจอเครื่องนี้แทน: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: thai-dubbing-api
    restart: unless-stopped
    entrypoint: ["python"]
    command: ["run.py"]
    env_file: .env
    environment:
      DATA_DIR: /app/data
      BACKUP_DIR: /app/backups
      FONTS_DIR: ""
      WORKER: modal
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
      - ${BACKUP_PATH:-./backups}:/app/backups
      - ./backend/app:/app/app
      - ./backend/run.py:/app/run.py

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      - api
    command: ["tunnel", "--no-autoupdate", "--url", "http://api:8000"]

  ngrok:
    image: ngrok/ngrok:latest
    profiles: [ngrok]
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    command: ["http", "api:8000", "--url", "${NGROK_DOMAIN}"]
    ports:
      - "127.0.0.1:4040:4040"
