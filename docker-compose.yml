# API บนเครื่อง (การ์ดจอ) + Cloudflare Tunnel เปิดให้หน้าเว็บบน Vercel เรียกได้
# รัน: docker compose up -d --build   ค่าทั้งหมดอ่านจาก .env (ดู .env.example หมวด Docker / Tunnel)
# ดูลิงก์: docker compose logs tunnel | grep trycloudflare
# ใช้ ngrok แทน: docker compose stop tunnel && docker compose --profile ngrok up -d ngrok
services:
  api:
    build: .
    image: thai-dubbing-api
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /app/data
      F5_CACHE_DIR: /models/f5
      FONTS_DIR: ""
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
      # แคชโมเดลเก็บใน volume ของ Docker (ext4) ไม่อ่านผ่านไดรฟ์ Windows
      # เพราะโมเดล Whisper 3 GB อ่านผ่าน 9p ตอน RAM ตึงแล้วขาดกลางทาง ("model.bin is incomplete")
      - hf-cache:/root/.cache/huggingface
      - f5-cache:/models/f5
      - ${TORCH_CACHE_HOST:-./models/torch}:/root/.cache/torch
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Cloudflare quick tunnel ฟรี ไม่จำกัดปริมาณข้อมูล แต่ลิงก์ *.trycloudflare.com เปลี่ยนทุกครั้งที่ container เริ่มใหม่
  # (ต้องแก้ BACKEND_URL บน Vercel ตาม) และรับ request ได้ครั้งละไม่เกิน 100 MB
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      - api
    command: ["tunnel", "--no-autoupdate", "--url", "http://api:8000"]

  # ngrok แบบฟรีได้ข้อมูลแค่ราว 1 GB ต่อเดือน เต็มแล้วจะตอบ ERR_NGROK_725
  ngrok:
    image: ngrok/ngrok:latest
    profiles: [ngrok]
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    command: ["http", "api:8000", "--url", "${NGROK_DOMAIN}"]
    ports:
      # หน้าดูคำขอที่ผ่าน ngrok http://localhost:4040
      - "127.0.0.1:4040:4040"

volumes:
  hf-cache:
  f5-cache:
