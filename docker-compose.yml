# API บนเครื่อง (การ์ดจอ) + ngrok เปิดให้หน้าเว็บบน Vercel เรียกได้
# รัน: docker compose up -d --build   ค่าทั้งหมดอ่านจาก .env (ดู .env.example หมวด Docker / ngrok)
services:
  api:
    build: .
    image: thai-dubbing-api
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /app/data
      F5_CACHE_DIR: /models/f5
      FONTS_DIR: ""
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
      # แคชโมเดลเก็บใน volume ของ Docker (ext4) ไม่อ่านผ่านไดรฟ์ Windows
      # เพราะโมเดล Whisper 3 GB อ่านผ่าน 9p ตอน RAM ตึงแล้วขาดกลางทาง ("model.bin is incomplete")
      - hf-cache:/root/.cache/huggingface
      - f5-cache:/models/f5
      - ${TORCH_CACHE_HOST:-./models/torch}:/root/.cache/torch
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    command: ["http", "api:8000", "--url", "${NGROK_DOMAIN}"]
    ports:
      # หน้าดูคำขอที่ผ่าน ngrok http://localhost:4040
      - "127.0.0.1:4040:4040"

volumes:
  hf-cache:
  f5-cache:
