# รันโมเดลบนการ์ดจอของเครื่องนี้แทน Modal (WORKER=local)
# docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
services:
  api:
    build:
      args:
        ML: "1"
    image: thai-dubbing-api-gpu
    environment:
      WORKER: local
      F5_CACHE_DIR: /models/f5
    volumes:
      # แคชโมเดลเก็บใน volume ของ Docker (ext4) ไม่อ่านผ่านไดรฟ์ Windows
      # เพราะโมเดล Whisper 3 GB อ่านผ่าน 9p ตอน RAM ตึงแล้วขาดกลางทาง ("model.bin is incomplete")
      - hf-cache:/root/.cache/huggingface
      - f5-cache:/models/f5
      - ${TORCH_CACHE_HOST:-./models/torch}:/root/.cache/torch
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  hf-cache:
  f5-cache:
